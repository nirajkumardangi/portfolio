<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Niraj Kumar Dangi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%230d756b'/%3E%3Ctext x='50' y='66' font-size='37' text-anchor='middle' font-family='Arial' font-weight='700' fill='white'%3ENKD%3C/text%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Sora:wght@700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #2E2017;
      background: radial-gradient(ellipse at 82% 0%, rgba(255, 238, 211, .66), transparent 40%), #EEC9A3;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      padding: 48px 36px;
      border: 1.5px solid rgba(255, 247, 228, .88);
      border-radius: 34px;
      background: linear-gradient(148deg, #FBE7CA, #F6D9B8);
      box-shadow: 12px 15px 28px rgba(94, 58, 31, .2), -7px -7px 17px rgba(255, 247, 228, .72), inset 1px 1px 2px rgba(255,255,255,.82);
    }
    h1 {
      margin: 0 0 8px;
      font-family: 'Sora', sans-serif;
      font-size: clamp(56px, 12vw, 80px);
      font-weight: 800;
      letter-spacing: -.06em;
      color: #246D5B;
      line-height: 1;
    }
    h2 {
      margin: 0 0 14px;
      font-family: 'Sora', sans-serif;
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 700;
      letter-spacing: -.03em;
    }
    p {
      margin: 0 0 24px;
      color: #705844;
      font-size: 15px;
      line-height: 1.55;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 22px;
      border: none;
      border-radius: 999px;
      color: #FFF9EE;
      background: linear-gradient(145deg, #2D8067, #155744);
      box-shadow: 7px 8px 15px rgba(30, 74, 54, .32), inset 1px 1px 2px rgba(255,255,255,.25);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .17s ease, box-shadow .17s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 9px 11px 20px rgba(30, 74, 54, .3); }
    a svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/">
      Go Home
      <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </a>
  </div>
</body>
</html>
